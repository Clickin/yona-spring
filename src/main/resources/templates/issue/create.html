<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="ko">
<head th:replace="~{site/layout :: head(title=#{title.newIssue})}">
</head>
<body class="theme-default prj" id="html-body">
<div id="main" class="main">
    <div th:replace="~{site/layout :: gnb}"></div>
    <div th:replace="~{project/header :: header(${project})}"></div>
    <div th:replace="~{project/menu :: menu(${project}, 'issue')}"></div>
    <link rel="stylesheet" th:href="@{/{owner}/{projectName}/issue/labels.css(owner=${project.owner}, projectName=${project.name})}" type="text/css" />


    <div class="page-wrap-outer">
        <div class="project-page-wrap">
            <div class="content-wrap frm-wrap">
                <p th:if="${invalidTemplateConfiguration == true}" role="alert" th:text="#{issue.template.invalid}"></p>
                <form th:if="${issueTemplates != null and !issueTemplates.isEmpty()}" method="get"
                      th:action="@{/{owner}/{projectName}/issueform(owner=${project.owner}, projectName=${project.name})}">
                    <input th:if="${parentIssue != null}" type="hidden" name="parentIssueId" th:value="${parentIssue.id}">
                    <input type="hidden" name="isFromGlobalMenuNew" th:value="${isFromGlobalMenuNew}">
                    <label for="template-choice" th:text="#{issue.template.choose}"></label>
                    <select id="template-choice" name="templateId">
                        <option value="" th:text="#{issue.template.legacy}"></option>
                        <option th:each="template : ${issueTemplates}" th:value="${template.id}" th:text="${template.name}"
                                th:selected="${selectedTemplate != null and selectedTemplate.id == template.id}"></option>
                    </select>
                    <button type="submit" class="ybtn" th:text="#{issue.template.load}"></button>
                </form>
                <form th:action="@{/{owner}/{projectName}/issues(owner=${project.owner}, projectName=${project.name})}" id="issue-form" method="post" enctype="multipart/form-data" th:data-validation-redisplay="${formError != null}">
                    <input th:if="${selectedTemplate != null}" type="hidden" name="templateId" th:value="${selectedTemplate.id}">
                    <input type="hidden" name="isFromGlobalMenuNew" th:value="${isFromGlobalMenuNew}">
                    <p th:if="${formError != null}" role="alert" th:text="${formError}"></p>
                    <div class="row-fluid">
                        <div class="span12">
                            <dl>
                                <dd>
                                    <div class="span12">
                                        <div class="span11">
                                            <input type="text" id="title" name="title" class="text title" maxlength="250" tabindex="1" th:placeholder="#{title}" autocomplete="off" th:title="#{title.help.key}" th:value="${param.title != null ? param.title[0] : issueForm.title}">
                                        </div>
                                        <div class="span1 subtask-message" th:classappend="${parentIssue != null or issueForm.targetProjectId != null} ? 'option-on' : ''" th:text="#{issue.option}">Option</div>
                                    </div>
                                    <!-- 하위 태스크 설정 영역 -->
                                    <div class="subtask-wrap" th:classappend="${parentIssue != null or issueForm.targetProjectId != null} ? 'show' : ''">
                                        <div class="span3">
                                            <select id="targetProjectId" name="targetProjectId" data-format="projects" th:data-placeholder="#{organization.choose.projects}" data-toggle="tomselect" data-container-css-class="fullsize" th:disabled="${parentIssue == null and issueForm.targetProjectId == null}">
                                                <option th:value="${project.id}" th:selected="${issueForm.targetProjectId == null or issueForm.targetProjectId == project.id}" th:data-avatar-url="@{/projects/{projectId}/logo(projectId=${project.id})}" th:text="${project.name}"></option>
                                                <option th:each="movable : ${movableProjects}" th:if="${movable.id != project.id}" th:value="${movable.id}" th:selected="${issueForm.targetProjectId == movable.id}" th:data-owner="${movable.owner} + ' /'" th:data-avatar-url="@{/projects/{projectId}/logo(projectId=${movable.id})}" th:text="${movable.name}"></option>
                                            </select>
                                        </div>
                                        <div class="span6">
                                            <select id="parentId" name="parentIssueId" data-format="issues" th:data-placeholder="#{organization.choose.projects}" data-toggle="tomselect" data-container-css-class="fullsize" th:disabled="${parentIssue == null and issueForm.targetProjectId == null}">
                                                <option value="" th:text="#{issue.subtask.select}">부모 이슈 선택</option>
                                                <option th:if="${parentIssue != null}" th:value="${parentIssue.id}" selected th:text="'#' + ${parentIssue.number} + '. ' + ${parentIssue.title}"></option>
                                                <option th:each="parentCandidate : ${parentCandidates}" th:value="${parentCandidate.id}" th:text="'#' + ${parentCandidate.number} + '. ' + ${parentCandidate.title}"></option>
                                            </select>
                                        </div>
                                    </div>
                                </dd>
                            </dl>
                        </div>

                        <div class="row-fluid">
                            <div class="span9 span-left-pane">
                                <fieldset th:if="${selectedTemplate != null and !selectedTemplate.fields.isEmpty()}">
                                    <legend th:text="${selectedTemplate.name}"></legend>
                                    <div th:each="field : ${selectedTemplate.fields}">
                                        <label th:for="${'answer-' + field.id}">
                                            <span th:text="${field.label}"></span>
                                            <span th:if="${field.required}" th:text="#{issue.template.required}"></span>
                                        </label>
                                        <textarea th:if="${field.type == 'text'}" th:id="${'answer-' + field.id}"
                                                  th:name="${'answer.' + field.id}" th:required="${field.required}"
                                                  maxlength="10000" rows="5" class="full" th:text="${answers[field.id]}"></textarea>
                                        <select th:if="${field.type == 'select'}" th:id="${'answer-' + field.id}"
                                                th:name="${'answer.' + field.id}" th:required="${field.required}">
                                            <option value="" th:text="#{issue.template.select}"></option>
                                            <option th:if="${answers[field.id] != null and answers[field.id] != '' and !field.options.contains(answers[field.id])}"
                                                    th:value="${answers[field.id]}" th:text="${answers[field.id]}" selected></option>
                                            <option th:each="option : ${field.options}" th:value="${option}" th:text="${option}"
                                                    th:selected="${answers[field.id] == option}"></option>
                                        </select>
                                    </div>
                                </fieldset>
                                <dl>
                                    <dd style="position: relative;">
                                        <div th:replace="~{site/layout :: markdownEditor('body', ${issueTemplate}, 'content-body')}"></div>
                                    </dd>
                                </dl>

                                <!-- 파일 업로더 영역 -->
                                <!-- Vue 3 SFC(components/vue-widgets) - <yona-attachments>가
                                     드롭존/업로드 버튼/카드 목록/temporaryUploadFiles 히든 필드를
                                     전부 자체 소유한다. -->
                                <yona-attachments data-resource-type="ISSUE_POST" id="upload"
                                                  th:data-temporary-upload-files="${temporaryUploadFiles}">
                                    <th:block th:each="attachment : ${temporaryAttachments}">
                                        <div th:replace="~{common/attachmentFile :: attachmentFile(${attachment})}"></div>
                                    </th:block>
                                </yona-attachments>

                                <div class="actrow right-txt">
                                    <button type="submit" id="button-save" class="ybtn ybtn-success" th:text="#{button.save}">저장</button><!--
                                 --><a href="javascript:history.back();" class="ybtn" th:text="#{button.cancel}">취소</a>
                                </div>
                            </div>
                            
                            <div class="span3 span-hard-wrap right-menu">
                                <dl class="issue-option">
                                    <dt th:text="#{issue.assignee}">담당자</dt>
                                    <dd>
                                        <input type="hidden" class="bigdrop" id="assignee" name="assigneeLoginId" th:value="${issueForm.assigneeLoginId}" th:placeholder="#{issue.noAssignee}" style="width: 100%" title="">
                                    </dd>
                                </dl>

                                <dl id="milestoneOption" class="issue-option" th:if="${project.isMilestoneEnabled}">
                                    <dt th:text="#{milestone}">마일스톤</dt>
                                    <dd>
                                        <div th:if="${milestones == null || milestones.isEmpty()}">
                                            <a th:href="@{/{owner}/{projectName}/newMilestoneForm(owner=${project.owner}, projectName=${project.name})}"
                                               class="ybtn ybtn-small ybtn-fullsize" target="_blank" th:text="#{milestone.menu.new}">
                                                새 마일스톤
                                            </a>
                                        </div>
                                        <div th:if="${milestones != null && !milestones.isEmpty()}">
                                            <select id="milestoneId" name="milestoneId"
                                                    data-toggle="tomselect" data-format="milestone" data-container-css-class="fullsize">
                                                <option value="" th:text="#{issue.noMilestone}">마일스톤 없음</option>
                                                <option th:each="milestone : ${milestones}" th:value="${milestone.id}" th:text="${milestone.title}" th:selected="${issueForm.milestoneId == milestone.id}"></option>
                                            </select>
                                        </div>
                                    </dd>
                                </dl>

                                <dl class="issue-option">
                                    <dt th:text="#{issue.dueDate}">마감일</dt>
                                    <dd>
                                        <div class="search search-bar">
                                            <input type="text" id="issueDueDate" data-toggle="calendar" name="dueDate" class="textbox full" th:value="${issueForm.dueDate}">
                                            <button type="button" class="search-btn btn-calendar"><i class="yobicon-calendar2"></i></button>
                                        </div>
                                    </dd>
                                </dl>

                                <dl class="issue-option" th:if="${labels != null && !labels.isEmpty()}">
                                    <dt>
                                        <span th:text="#{label}">라벨</span>
                                        <a th:if="${@templateHelper.isManager(project, currentUser)}"
                                           th:href="@{/{owner}/{projectName}/issue/labelsform(owner=${project.owner}, projectName=${project.name})}" target="_blank" class="label-edit">
                                            [<span th:text="#{button.edit}">편집</span>]
                                        </a>
                                    </dt>
                                    <dd>
                                        <select id="labelIds" name="labelIds" multiple="multiple" data-search="labelIds"
                                                data-toggle="tomselect" data-format="issuelabel" data-allow-clear="true"
                                                data-dropdown-css-class="issue-labels" data-container-css-class="issue-labels bordered fullsize"
                                                th:data-placeholder="#{label.select}" class="hide">
                                            <option></option>
                                            <optgroup th:each="entry : ${labelMap}" th:label="${entry.key.name}"
                                                      th:data-category-id="${entry.key.id}"
                                                      th:data-category-is-exclusive="${entry.key.isExclusive}">
                                                <option th:each="label : ${entry.value}" th:value="${label.id}"
                                                        th:selected="${issueForm.labelIds != null and issueForm.labelIds.contains(label.id)}"
                                                        th:data-category-id="${entry.key.id}"
                                                        th:data-category-is-exclusive="${entry.key.isExclusive}"
                                                        th:text="${label.name}">
                                                    Label Name
                                                </option>
                                            </optgroup>
                                        </select>
                                    </dd>
                                </dl>
                                
                                <input type="hidden" name="referCommentId" th:value="${param.referCommentId != null ? param.referCommentId[0] : (param.commentId != null ? param.commentId[0] : '')}">
                                <input type="hidden" id="isDraft" name="isDraft" th:value="${isDraft}">
                            </div>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <footer th:replace="~{site/layout :: footer}"></footer>
</div>

<th:block th:replace="~{site/layout :: scripts}"></th:block>
<th:block th:replace="~{common/tomselect :: tomselect}"></th:block>
<th:block th:replace="~{common/calendar :: calendar}"></th:block>
<th:block th:replace="~{site/layout :: markdown(${project})}"></th:block>
<script type="text/javascript" src="/javascripts/lib/tribute/tribute.min.js"></script>
<script type="text/javascript" src="/javascripts/common/yona.Subtask.js"></script>
<script type="text/javascript" src="/javascripts/service/yona.issue.Assginee.js"></script>
<script type="text/javascript" src="/javascripts/common/yona.TitleHeadAutoCompletion.js"></script>
<script type="text/javascript">
    document.addEventListener("DOMContentLoaded", function(){
        $yona.loadModule("issue.Write", {
            "sMode"		   : "new",
            "sIssueFormURL": "/[[${project.owner}]]/[[${project.name}]]/issueform",
            "sIssueListURL": "/[[${project.owner}]]/[[${project.name}]]/issues",
            "elTextarea"   : 'textarea[data-editor-mode="content-body"]',
            "elMilestoneRefresh": document.querySelector("#milestoneOption .yobicon-refresh"),
            "elDueDate"    : document.getElementById("issueDueDate")
        });

        if([[${isFromGlobalMenuNew and formError == null}]]) {
            document.querySelectorAll(".subtask-message").forEach(function(el){ el.click(); });
        }

        yonaAssgineeModule(
                "/api/projects/[[${project.id}]]/assignableUsers",
                "",
                "[[#{issue.assignee}]]"
        );

        yonaTitleHeadModule({
            "target": 'input[id=title]',
            "url"   : "/api/[[${project.owner}]]/[[${project.name}]]/titleHeads"
        });

        var btnSave = document.getElementById('button-save');
        if(btnSave){
            btnSave.addEventListener('click', function(event){
                event.preventDefault();
                var issueForm = document.getElementById('issue-form');
                if (!issueForm || !issueForm.reportValidity()) return;
                btnSave.disabled = true;
                setTimeout(function (){
                    btnSave.disabled = false;
                }, 3000);

                if(issueForm){
                    issueForm.submit();
                }
            });
        }
    });
</script>
</body>
</html>
