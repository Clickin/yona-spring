<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
</head>
<body>
<!-- Vue script setup uploader; translated labels come from site/layout's template.
     Native upload IDs stay in light DOM; yona.Attachments.js supplies the textarea. -->
<yona-attachments th:fragment="uploadForm(resourceType, resourceId, formId)"
     th:id="${formId}"
     th:attr="data-resource-type=${resourceType},data-resource-id=${resourceId}">
</yona-attachments>
</body>
</html>
