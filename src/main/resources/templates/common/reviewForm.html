<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
</head>
<body>
<div th:fragment="reviewForm(project, resourceType, action)" id="review-form" class="review-form" style="display:none;">
  <form th:action="${action}" method="post" enctype="multipart/form-data">
    <div class="author-info-wrap pull-left hide-in-mobile">
      <div class="author-info">
        <a th:href="@{/user/{loginId}(loginId=${currentUser.loginId})}" class="avatar-wrap medium"
           th:title="${currentUser.name}" target="_blank" rel="noopener">
          <img th:src="${currentUser.avatarUrl}" th:alt="${currentUser.name}" width="32" height="32">
        </a>
      </div>
    </div>
    <div class="write-comment-box">
      <div class="write-comment-wrap">
        <div class="pull-right">
          <button type="button" class="ybtn ybtn-default ybtn-small" data-toggle="close" th:aria-label="#{button.cancel}">×</button>
        </div>
        <div th:replace="~{site/layout :: markdownEditor('contents', '', 'code-review-body')}"></div>
        <div th:replace="~{common/uploadForm :: uploadForm(${resourceType}, null, null)}"></div>
        <div class="right-txt">
          <button type="button" class="ybtn ybtn-small" data-toggle="close" th:text="#{button.cancel}">Cancel</button>
          <button type="submit" class="ybtn ybtn-success ybtn-small" th:text="#{button.comment.new}">Add a comment</button>
        </div>
      </div>
    </div>
  </form>
</div>
</body>
</html>
