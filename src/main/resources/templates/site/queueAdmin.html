<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en" th:lang="${#locale.toLanguageTag()}">
<head th:replace="~{site/layout :: head(#{${message}})}"></head>
<body class="theme-default queue-admin-page">
<div id="main" class="main">
  <div th:replace="~{site/layout :: gnb}"></div>
  <div th:replace="~{site/layout :: breadcrumb}"></div>
  <div class="page-wrap-outer">
    <div class="site-setting-wrap">
      <div class="row-fluid">
        <div th:replace="~{site/layout :: sidebar('queue')}"></div>
        <main class="span10 queue-admin" aria-labelledby="queue-heading">
          <div class="title_area">
            <h2 id="queue-heading" class="pull-left" th:text="#{queue.admin.title}"></h2>
          </div>
          <form th:if="${state != null or draft != null}" method="get" th:action="@{/site/admin/queue}"
                class="queue-filters" data-turbo="false" th:with="f=${state != null ? state : draft}">
            <p th:if="${filterError}" class="queue-filter-error" th:text="#{queue.admin.filterError}"></p>
            <div class="queue-status-group" role="group" th:aria-label="#{queue.admin.status}">
              <label class="queue-status-option" th:each="status : ${statuses}">
                <input type="checkbox" name="status" th:value="${status}" th:checked="${#lists.contains(f.status, status)}">
                <span th:text="#{${'queue.admin.status.' + status}}"></span>
              </label>
            </div>
            <div class="search-bar">
              <label><span th:text="#{queue.admin.taskType}"></span> <input class="textbox small" name="type" maxlength="120" th:value="${f.type}"></label>
              <label><span th:text="#{queue.admin.resource}"></span> <input class="textbox small" name="resource" maxlength="300" th:value="${f.resource}"></label>
              <button type="submit" class="search-btn" th:aria-label="#{queue.admin.filter}"><i class="yobicon-search"></i></button>
            </div>
            <a class="ybtn ybtn-small" th:href="@{/site/admin/queue}" data-turbo="false" th:text="#{queue.admin.clearFilters}"></a>
          </form>
          <yona-queue-events th:attr="src=@{/api/admin/queue/v1/events}">
            <p role="status" aria-live="polite" data-queue-connection th:text="#{queue.admin.js.waiting}"></p>
            <a class="ybtn ybtn-small" th:href="${pageUrl != null} ? @{${pageUrl}} : @{/site/admin/queue}" data-queue-refresh data-turbo="false" th:text="#{queue.admin.refresh}"></a>
            <turbo-frame id="queue-content" th:fragment="content" target="_top" data-turbo="false">
              <p th:if="${queueError != null}" role="alert"><span th:text="#{${'queue.admin.error.' + queueError}}"></span> (<strong th:text="${queueError}"></strong>)</p>
              <th:block th:if="${page != null}">
                <section th:if="${detail != null}" id="queue-detail" aria-labelledby="queue-detail-heading" th:attr="data-job-id=${detail.id}">
                  <div class="queue-detail-head">
                    <h3 id="queue-detail-heading" tabindex="-1"><span th:text="#{queue.admin.detail}"></span> <span th:text="${detail.id}"></span></h3>
                    <a class="ybtn ybtn-small" th:href="@{${closeUrl}}" th:text="#{queue.admin.closeDetail}"></a>
                  </div>
                  <dl>
                    <dt th:text="#{queue.admin.type}"></dt><dd th:text="${detail.type}"></dd>
                    <dt th:text="#{queue.admin.status}"></dt><dd><span th:class="'queue-status queue-status-' + ${detail.status}" th:text="#{${'queue.admin.status.' + detail.status}}"></span></dd>
                    <dt th:text="#{queue.admin.resource}"></dt><dd th:text="${#strings.listJoin(detail.resources, ', ')}"></dd>
                    <dt th:text="#{queue.admin.progress}"></dt><dd><th:block th:replace="~{site/queueAdmin :: progress(${detail.progress})}"></th:block></dd>
                    <dt th:text="#{queue.admin.scheduledAt}"></dt><dd th:text="${times.utc(detail.scheduledAt)}"></dd>
                    <dt th:text="#{queue.admin.nextAttemptAt}"></dt><dd th:text="${times.utc(detail.nextAttemptAt)}"></dd>
                    <dt th:text="#{queue.admin.startedFinished}"></dt><dd><span th:text="${detail.startedAt != null} ? ${times.utc(detail.startedAt)} : (${detail.executionGeneration != '1' and detail.status == 'QUEUED'} ? #{queue.admin.waitingGeneration} : '—')"></span> / <span th:text="${times.utc(detail.finishedAt)}"></span></dd>
                    <dt th:text="#{queue.admin.updatedAt}"></dt><dd th:text="${times.utc(detail.updatedAt)}"></dd>
                    <dt th:text="#{queue.admin.generationAttempts}"></dt><dd><span th:text="${detail.executionGeneration}"></span> / <span th:text="${detail.attemptCount}"></span></dd>
                    <dt th:text="#{queue.admin.owner}"></dt><dd th:text="${detail.ownerInstance ?: '—'}"></dd>
                    <dt th:text="#{queue.admin.failureDisposition}"></dt><dd th:text="${detail.failureDisposition != null} ? #{${'queue.admin.failure.' + detail.failureDisposition}} : '—'"></dd>
                  </dl>
                  <p th:if="${detail.errorCode != null}" role="note"><strong th:text="${detail.errorCode}"></strong>: <span th:text="${detail.errorSummary}"></span></p>
                  <p th:if="${detail.status == 'CANCEL_REQUESTED'}" th:text="#{queue.admin.cancelPending}"></p>
                  <form th:if="${#lists.contains({'QUEUED','RETRY_WAIT'}, detail.status)}"
                        method="post" th:action="@{/site/admin/queue/jobs/{id}/{action}(id=${detail.id},action=${detail.prioritized ? 'deprioritize' : 'prioritize'})}" data-turbo="false" class="queue-command">
                    <th:block th:replace="~{site/queueAdmin :: commandState}"></th:block>
                    <button type="submit" class="ybtn ybtn-small" th:text="${detail.prioritized} ? #{queue.admin.deprioritize} : #{queue.admin.prioritize}"></button>
                  </form>
                  <form th:if="${#lists.contains({'QUEUED','RETRY_WAIT','RUNNING','CANCEL_REQUESTED'}, detail.status)}"
                        method="post" th:action="@{/site/admin/queue/jobs/{id}/cancel(id=${detail.id})}" data-turbo="false" class="queue-command">
                    <th:block th:replace="~{site/queueAdmin :: commandState}"></th:block>
                    <label><span th:text="#{queue.admin.cancelReason}"></span> <input name="reason" th:value="${reason}" aria-describedby="queue-reason-help"></label>
                    <button type="submit" class="ybtn ybtn-small ybtn-danger" th:disabled="${detail.status == 'CANCEL_REQUESTED'}" th:text="#{queue.admin.cancel}"></button>
                  </form>
                  <form th:if="${#lists.contains({'FAILED','RECOVERY_REQUIRED','BLOCKED_UNSUPPORTED'}, detail.status)}"
                        method="post" th:action="@{/site/admin/queue/jobs/{id}/retry(id=${detail.id})}" data-turbo="false" class="queue-command">
                    <th:block th:replace="~{site/queueAdmin :: commandState}"></th:block>
                    <label th:if="${detail.status == 'RECOVERY_REQUIRED'}"><input type="checkbox" name="recoveryAcknowledged" value="true" required th:checked="${recoveryAcknowledged}"> <span th:text="#{queue.admin.retryAcknowledgement}"></span></label>
                    <label><span th:text="#{queue.admin.retryReason}"></span> <input name="reason" th:value="${reason}" th:required="${detail.status == 'RECOVERY_REQUIRED'}" aria-describedby="queue-reason-help"></label>
                    <button type="submit" class="ybtn ybtn-small" th:text="#{queue.admin.retry}"></button>
                  </form>
                  <form th:if="${#lists.contains({'FAILED','RECOVERY_REQUIRED','BLOCKED_UNSUPPORTED'}, detail.status)}"
                        method="post" th:action="@{/site/admin/queue/jobs/{id}/abandon(id=${detail.id})}" data-turbo="false" class="queue-command">
                    <th:block th:replace="~{site/queueAdmin :: commandState}"></th:block>
                    <label th:if="${detail.status == 'RECOVERY_REQUIRED'}"><input type="checkbox" name="recoveryAcknowledged" value="true" required th:checked="${recoveryAcknowledged}"> <span th:text="#{queue.admin.abandonAcknowledgement}"></span></label>
                    <label><span th:text="#{queue.admin.abandonReason}"></span> <input name="reason" th:value="${reason}" required aria-describedby="queue-reason-help"></label>
                    <button type="submit" class="ybtn ybtn-small ybtn-danger" th:text="#{queue.admin.abandon}"></button>
                  </form>
                  <p id="queue-reason-help" th:text="#{queue.admin.reasonHelp}"></p>
                  <div th:if="${detail.result != null}">
                    <h4 th:text="#{queue.admin.result}"></h4>
                    <a th:href="@{/api/admin/queue/v1/jobs/{id}/result(id=${detail.id})}" data-turbo="false" th:text="${detail.result.fileName}"></a>
                    <p><span th:text="#{queue.admin.resultSize(${detail.result.sizeBytes})}"></span> · SHA-256 <code th:text="${detail.result.sha256}"></code></p>
                  </div>
                  <h4 th:text="#{queue.admin.historyCount(${detail.attemptHistoryCount})}"></h4>
                  <div class="queue-table-scroll" role="region" th:aria-label="#{queue.admin.history}" tabindex="0">
                    <table class="table">
                      <caption th:text="#{queue.admin.historyCaption}"></caption>
                      <thead><tr><th scope="col" th:text="#{queue.admin.attemptGeneration}"></th><th scope="col" th:text="#{queue.admin.statusOwner}"></th><th scope="col" th:text="#{queue.admin.startedFinished}"></th><th scope="col" th:text="#{queue.admin.progressError}"></th></tr></thead>
                      <tbody><tr th:each="attempt : ${detail.attempts}" th:attr="data-attempt-no=${attempt.attemptNo}">
                        <td><span th:text="${attempt.attemptNo}"></span> / <span th:text="${attempt.executionGeneration}"></span></td>
                        <td><span th:text="#{${'queue.admin.attempt.' + attempt.status}}"></span><br><span th:text="${attempt.ownerInstance}"></span></td>
                        <td><time th:datetime="${attempt.startedAt}" th:text="${times.utc(attempt.startedAt)}"></time><br><time th:datetime="${attempt.finishedAt}" th:text="${times.utc(attempt.finishedAt)}"></time></td>
                        <td><th:block th:replace="~{site/queueAdmin :: progress(${attempt.progress})}"></th:block><strong th:text="${attempt.errorCode}"></strong> <span th:text="${attempt.errorSummary}"></span></td>
                      </tr><tr th:if="${#lists.isEmpty(detail.attempts)}"><td colspan="4" th:text="#{queue.admin.historyEmpty}"></td></tr></tbody>
                    </table>
                  </div>
                  <nav th:aria-label="#{queue.admin.historyPages}"><a th:if="${state.attemptCursor != null}" class="ybtn ybtn-small" th:href="@{${firstAttemptUrl}}" th:text="#{queue.admin.newestAttempts}"></a> <a th:if="${nextAttemptUrl != null}" class="ybtn ybtn-small" th:href="@{${nextAttemptUrl}}" th:text="#{queue.admin.previousAttempts}"></a></nav>
                </section>
                <div class="queue-table-scroll" role="region" th:aria-label="#{queue.admin.jobs}" tabindex="0">
                  <table class="table table-striped">
                    <caption th:text="#{queue.admin.jobsCaption}"></caption>
                    <thead><tr><th scope="col" th:text="#{queue.admin.jobId}"></th><th scope="col" th:text="#{queue.admin.typeResource}"></th><th scope="col" th:text="#{queue.admin.status}"></th><th scope="col" th:text="#{queue.admin.progress}"></th><th scope="col" th:text="#{queue.admin.createdAt}"></th></tr></thead>
                    <tbody>
                    <tr th:each="job : ${page.items}" th:attr="data-job-id=${job.id}">
                      <td><a th:href="@{${jobUrls[job.id]}}" th:text="${job.id}" th:attr="aria-current=${state.selected == job.id ? 'true' : null}"></a> <span th:if="${job.prioritized}" class="queue-priority" th:text="#{queue.admin.prioritized}"></span></td>
                      <td><span th:text="${job.type}"></span><span class="queue-resources" th:text="${#strings.listJoin(job.resources, ', ')}"></span></td>
                      <td><span th:class="'queue-status queue-status-' + ${job.status}" th:text="#{${'queue.admin.status.' + job.status}}"></span></td>
                      <td><th:block th:replace="~{site/queueAdmin :: progress(${job.progress})}"></th:block></td>
                      <td><time th:datetime="${job.createdAt}" th:text="${times.utc(job.createdAt)}"></time></td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(page.items)}"><td colspan="5" th:text="#{queue.admin.empty}"></td></tr>
                    </tbody>
                  </table>
                </div>
                <nav th:aria-label="#{queue.admin.jobsPages}">
                  <a th:if="${state.cursor != null}" class="ybtn ybtn-small" th:href="@{${firstUrl}}" th:text="#{queue.admin.newestJobs}"></a>
                  <a th:if="${nextUrl != null}" class="ybtn ybtn-small" th:href="@{${nextUrl}}" th:text="#{queue.admin.nextJobs}"></a>
                </nav>
              </th:block>
            </turbo-frame>
          </yona-queue-events>
        </main>
      </div>
    </div>
  </div>
  <footer th:replace="~{site/layout :: footer}"></footer>
</div>
<th:block th:replace="~{site/layout :: scripts}"></th:block>
<link rel="stylesheet" th:href="@{/stylesheets/queue-admin.css}">
<script type="module" th:src="@{/javascripts/service/yona.queue.Admin.js}"></script>

<th:block th:if="${false}">
<th:block th:fragment="progress(progress)">
  <span th:if="${progress == null}">—</span>
  <th:block th:if="${progress != null}"><span th:text="${progress.stage}"></span><ul class="queue-counters"><li th:each="counter : ${progress.counters}"><span th:text="${counter.key}"></span>: <span th:text="${counter.value}"></span></li></ul></th:block>
</th:block>
<th:block th:fragment="commandState">
  <input type="hidden" name="commandId" th:value="${commandId}">
  <input th:each="status : ${state.status}" type="hidden" name="status" th:value="${status}">
  <input th:if="${state.type != null}" type="hidden" name="type" th:value="${state.type}">
  <input th:if="${state.resource != null}" type="hidden" name="resource" th:value="${state.resource}">
  <input th:if="${state.cursor != null}" type="hidden" name="cursor" th:value="${state.cursor}">
  <input type="hidden" name="selected" th:value="${state.selected}">
  <input th:if="${state.attemptCursor != null}" type="hidden" name="attemptCursor" th:value="${state.attemptCursor}">
</th:block>
</th:block>
</body>
</html>
