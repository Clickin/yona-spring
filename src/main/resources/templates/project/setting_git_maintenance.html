<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head th:replace="~{site/layout :: head(${project.name} + ' - Git GC')}"></head>
<body class="prj" id="html-body">
<div id="main" class="main">
    <div th:replace="~{site/layout :: gnb}"></div>
    <div th:replace="~{project/header :: header(${project})}"></div>
    <div th:replace="~{project/menu :: menu(${project}, 'setting')}"></div>
    <div class="page-wrap-outer">
        <div class="project-page-wrap">
            <div th:replace="~{project/setting_menu :: menu(${project}, 'setting')}"></div>
            <div class="bubble-wrap gray">
                <div class="box-wrap top">
                    <h3>Git GC</h3>
                    <p>저장소 객체를 pack으로 정리합니다. 작업은 백그라운드 큐에서 실행되며, 즉시 prune하거나 reflog를 만료시키지 않습니다.</p>
                    <p>자동 GC는 설정된 주기와 저장소 유휴 조건을 만족할 때 실행됩니다. 수동 GC는 유휴 시간을 기다리지 않습니다.</p>
                    <p th:if="${gcQueued != null}" role="status" th:text="'GC 작업 #' + ${gcQueued} + '을 요청했습니다.'"></p>
                    <dl th:if="${gcJob != null}">
                        <dt>최근 작업</dt><dd th:text="'#' + ${gcJob.id}"></dd>
                        <dt>상태</dt><dd th:text="${gcJob.status}"></dd>
                    </dl>
                    <p th:if="${gcJob == null}">아직 GC 작업이 없습니다.</p>
                    <form method="post" th:action="@{/{owner}/{name}/setting/git-maintenance(owner=${project.owner},name=${project.name})}">
                        <button type="submit" class="ybtn ybtn-primary">Git GC 실행</button>
                        <a class="ybtn" th:href="@{/{owner}/{name}/setting/git-maintenance(owner=${project.owner},name=${project.name})}">상태 새로고침</a>
                        <a class="ybtn" th:href="@{/{owner}/{name}/setting(owner=${project.owner},name=${project.name})}">설정으로 돌아가기</a>
                    </form>
                </div>
            </div>
        </div>
    </div>
    <div th:replace="~{site/layout :: footer}"></div>
</div>
</body>
</html>
