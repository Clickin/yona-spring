<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
</head>
<body>
<!-- 드롭존/업로드 버튼/첨부파일 카드 목록: <yona-attachments>(frontend/src/attachments)가
     site/layout의 #yona-attachments-template에서 번역 문구를 읽어 Vue 템플릿으로 Shadow DOM을 렌더링한다.
     yona.Attachments.js가 configure()에 위임한다(태그명으로 판별). -->
<yona-attachments th:fragment="uploadForm(resourceType, resourceId, formId)"
     th:id="${formId}"
     th:attr="data-resource-type=${resourceType},data-resource-id=${resourceId}">
</yona-attachments>
</body>
</html>
